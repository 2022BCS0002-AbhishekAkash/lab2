name: Lab4 CI-CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  train:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train model
        run: |
          python scripts/train.py

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: model
          path: model.joblib

      - name: Upload metrics artifact
        uses: actions/upload-artifact@v4
        with:
          name: metrics
          path: metrics.json

  deploy:
    needs: train
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download model artifact
        uses: actions/download-artifact@v4
        with:
          name: model

      - name: Download metrics artifact
        uses: actions/download-artifact@v4
        with:
          name: metrics

      - name: Read metrics and compare
        id: metrics
        run: |
          R2=$(jq '.r2' metrics.json)
          MSE=$(jq '.mse' metrics.json)

          echo "New R2: $R2"
          echo "New MSE: $MSE"

          echo "OLD_R2=${{ vars.BEST_R2 }}"
          echo "OLD_MSE=${{ vars.BEST_MSE }}"

          if (( $(echo "$R2 > ${{ vars.BEST_R2 }}" | bc -l) )) && \
             (( $(echo "$MSE < ${{ vars.BEST_MSE }}" | bc -l) )); then
            echo "improved=true" >> $GITHUB_OUTPUT
          else
            echo "improved=false" >> $GITHUB_OUTPUT
          fi

      - name: Metric not improved
        if: steps.metrics.outputs.improved == 'false'
        run: |
          echo "2022BCS0002 ---- Metric did not improve"

      - name: Login to Docker Hub
        if: steps.metrics.outputs.improved == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build Docker image
        if: steps.metrics.outputs.improved == 'true'
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/wine-inference:latest .

      - name: Push Docker image
        if: steps.metrics.outputs.improved == 'true'
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/wine-inference:latest

      - name: Update BEST_R2 variable
        if: steps.metrics.outputs.improved == 'true'
        run: |
          curl -X PATCH \
            -H "Authorization: Bearer ${{ secrets.GH_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/variables/BEST_R2 \
            -d "{\"name\":\"BEST_R2\",\"value\":\"$(jq -r '.r2' metrics.json)\"}"

      - name: Update BEST_MSE variable
        if: steps.metrics.outputs.improved == 'true'
        run: |
          curl -X PATCH \
            -H "Authorization: Bearer ${{ secrets.GH_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/variables/BEST_MSE \
            -d "{\"name\":\"BEST_MSE\",\"value\":\"$(jq -r '.mse' metrics.json)\"}"
