name: ML Training Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  train-model:
    runs-on: ubuntu-latest

    steps:
    # 1️⃣ Checkout repository
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2️⃣ Setup Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3️⃣ Install dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4️⃣ Run training script
    - name: Run training script
      run: |
        python train.py

    # 5️⃣ Write results to Job Summary
    - name: Write evaluation summary
      run: |
        echo "## 📊 Model Evaluation Summary" >> $GITHUB_STEP_SUMMARY
        echo "**Name:** Abhishek Akash" >> $GITHUB_STEP_SUMMARY
        echo "**Roll Number:** ]2022BCS0002" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Metrics" >> $GITHUB_STEP_SUMMARY
        cat outputs/results.json >> $GITHUB_STEP_SUMMARY

    # 6️⃣ Upload artifacts
    - name: Upload model and metrics
      uses: actions/upload-artifact@v4
      with:
        name: ml-artifacts
        path: outputs/
